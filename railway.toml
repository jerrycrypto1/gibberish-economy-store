# Config-as-code for a single Railway service (web).
# Dockerfile present → Railway uses it (platform rule).
# Healthcheck origin: healthcheck.railway.app
# App MUST listen on $PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh ./railway-start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
